<!DOCTYPE html>
<html lang="om">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Naol Flight 3D – Xiyyaaraawwan Yeroo Dhugaa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#05080f;--ac:#5ee7ff;--panel:rgba(6,14,30,.72);--line:#22304c;--amber:#ffc233;--mil:#ff5a4f;--teal:#4fd1c5;--txt:#e8eefc;--mut:#8b9bbd}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--ink);color:var(--txt);font-family:'Exo 2',system-ui,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
#globe{position:fixed;inset:0}
.glass{box-shadow:0 8px 40px rgba(0,120,255,.18),inset 0 0 0 1px rgba(94,231,255,.1);background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px}
#top{position:fixed;top:max(10px,env(safe-area-inset-top));left:10px;right:10px;display:flex;flex-direction:column;gap:8px;pointer-events:none;z-index:5}
#top>*{pointer-events:auto}
.row{display:flex;gap:8px;align-items:center}
#q{flex:1;min-width:0;padding:12px 14px;color:var(--txt);font:600 14px 'Exo 2',sans-serif;outline:none;border-radius:14px}
#q:focus{border-color:var(--ac)}
#cnt{padding:11px 13px;font-size:12px;white-space:nowrap;display:flex;gap:7px;align-items:center;border-radius:14px}
#dot{width:8px;height:8px;border-radius:50%;background:var(--mut)}
#dot.ok{background:#3ddc84;box-shadow:0 0 8px #3ddc84}#dot.err{background:var(--mil)}
#chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
#chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 13px;border-radius:99px;font:600 12px 'Exo 2',sans-serif;color:var(--mut);background:var(--panel);border:1px solid var(--line);cursor:pointer}
.chip.on{box-shadow:0 0 14px rgba(94,231,255,.5);color:#04121a;background:var(--ac);border-color:var(--ac)}
#panel{position:fixed;left:8px;right:8px;bottom:max(8px,env(safe-area-inset-bottom));max-height:54vh;overflow:auto;padding:16px;z-index:6;transform:translateY(120%);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
#panel.open{transform:none}
.h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.cs{font-size:26px;font-weight:700;letter-spacing:-.5px}
.sub{font-size:12px;color:var(--mut);margin-top:2px}
.btn{border:1px solid var(--line);background:#0e1730;color:var(--txt);border-radius:10px;padding:8px 11px;font:600 12px 'Exo 2',sans-serif;cursor:pointer}
.btn.on{background:var(--ac);color:#111;border-color:var(--ac)}
.route{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin:16px 0 6px}
.ap b{font-size:24px;display:block}.ap span{font-size:11px;color:var(--mut)}
.ap:last-child{text-align:right}
.mid{font-size:11px;color:var(--mut);text-align:center}
.bar{height:5px;border-radius:5px;background:#16213b;position:relative;margin:8px 0 14px}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:linear-gradient(90deg,var(--teal),var(--ac))}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.s{background:#0b1226;border:1px solid #1a2744;border-radius:12px;padding:10px 12px}
.s small{display:block;font-size:10.5px;color:var(--mut);margin-bottom:3px}
.s b{font-size:15px;font-variant-numeric:tabular-nums}
.s em{font-style:normal;font-size:11px;color:var(--mut);font-weight:400}
#photo{width:100%;border-radius:12px;margin-top:10px;display:none}
.tag{display:inline-block;font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:99px;margin-right:4px;background:#16213b}
.tag.m{background:var(--mil);color:#fff}.tag.e{background:#ff9500;color:#111}
#toast{position:fixed;top:120px;left:50%;transform:translateX(-50%);padding:10px 16px;border-radius:12px;font-size:13px;z-index:9;opacity:0;pointer-events:none;transition:opacity .3s}
#toast.on{opacity:1}
#att{position:fixed;right:8px;top:calc(100% - 20px);font-size:9.5px;color:#5d6d8f;z-index:3;display:none}
@media(min-width:760px){
#top{left:16px;right:auto;width:440px}
#panel{left:16px;right:auto;width:380px;top:132px;bottom:16px;max-height:none}
#att{display:block}}
</style>
</head>
<body>
<div id="globe"></div>
<div id="top">
  <div class="row">
    <input id="q" class="glass" placeholder="Barbaadi: callsign, registration (ET-AVJ), hex…" autocomplete="off">
    <div id="cnt" class="glass"><span id="dot"></span><span id="n">0</span></div>
  </div>
  <div id="chips">
    <button class="chip on" data-f="all">Hunda</button>
    <button class="chip" data-f="mil">Loltuu</button>
    <button class="chip" data-f="heli">Helikoopitarii</button>
    <button class="chip" data-f="uav">Dirooniin</button>
    <button class="chip" data-f="em">Balaa (7700)</button>
    <button class="chip on" data-t="ap">🛑 Dhaabbata xiyyaaraa</button>
    <button class="chip on" data-t="wp">🚀 Meesha waraanaa</button>
  </div>
  <div id="dbg" style="font-size:10px;color:#8b9bbd;word-break:break-all"></div>
</div>
<div id="panel" class="glass"></div>
<div id="toast" class="glass"></div>
<div id="att">Data: airplanes.live · adsb.lol · adsbdb.com</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/globe.gl@2.32.0/dist/globe.gl.min.js"></script>
<script>
const $=s=>document.querySelector(s);
if(typeof Globe==='undefined'||typeof THREE==='undefined'){
  document.body.insertAdjacentHTML('beforeend','<div class="glass" style="position:fixed;left:16px;right:16px;top:45%;padding:18px;z-index:20;text-align:center;font-size:14px">Maktabaa 3D (Globe.gl) hin fe\'amne. Internet kee ilaali, ergasii fuula haaromsi.</div>');
  throw new Error('Globe/THREE not loaded');
}
const PROXY=''; // Asitti link Cloudflare Worker kee galchi, fkn 'https://naol-flights.maqaa.workers.dev'
const HOSTS=[PROXY&&PROXY+'/v2','https://api.airplanes.live/v2','https://api.adsb.lol/v2','https://opendata.adsb.fi/api/v2'].filter(Boolean);
const DBG={};
const HUBS=[[9,38.8],[40.6,-73.8],[51.5,-.5],[50,8.5],[25,55],[28.5,77],[1.3,103.9],[35.5,139.8],[22.3,114],[-33.9,151.2],[-23.5,-46.5],[33.9,-118.4],[41.9,-87.9],[30,31],[55.7,37.6],[-26,28],[19.4,-99],[39.9,116.5],[37.5,127],[48.8,2.4],[6.5,3.4],[-1.3,36.9],[41,29],[13,100.7]];
const A=new Map(), cache={};
let sel=null, follow=false, filter='all', hi=0, tick=0;
const R=Math.PI/180;

/* ---------- Globe ---------- */
const IMG='https://cdn.jsdelivr.net/npm/three-globe@2.31.0/example/img/';
const G=Globe()($('#globe'))
  .globeImageUrl(IMG+'earth-blue-marble.jpg').bumpImageUrl(IMG+'earth-topology.png')
  .backgroundImageUrl(IMG+'night-sky.png')
  .atmosphereColor('#6aa8ff').atmosphereAltitude(.2)
  .customLayerData([]).customThreeObject(d=>d.mesh).customThreeObjectUpdate(()=>{})
  .onCustomLayerClick(d=>select(d.hex))
  .pathsData([]).pathPoints('pts').pathPointLat(p=>p[0]).pathPointLng(p=>p[1]).pathPointAlt(.006)
  .pathColor('color').pathStroke(.5).pathDashLength(d=>d.dash?.015:1).pathDashGap(.012)
  .pathDashAnimateTime(d=>d.dash?9000:0).pathTransitionDuration(0)
  .ringsData([]).ringColor(()=>t=>`rgba(255,255,255,${1-t})`).ringMaxRadius(2.5).ringPropagationSpeed(2).ringRepeatPeriod(1000);
G.pointOfView({lat:5,lng:20,altitude:5},0);
setTimeout(()=>G.pointOfView({lat:9,lng:38,altitude:1.6},4200),400);
G.renderer().setPixelRatio(Math.min(window.devicePixelRatio||1,2.5));
setTimeout(()=>{const m=G.globeMaterial().map;if(m){m.anisotropy=G.renderer().capabilities.getMaxAnisotropy();m.needsUpdate=true}},2500);
if(typeof G.globeTileEngineUrl==='function')G.globeTileEngineUrl((x,y,l)=>`https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/${l}/${y}/${x}`);
G.labelText('name').labelLat('lat').labelLng('lng').labelDotRadius(0).labelColor(()=>'rgba(235,245,255,.9)').labelResolution(2).labelAltitude(.004).labelsData([]);
const ctl=G.controls(); ctl.autoRotate=false; ctl.autoRotateSpeed=.5; ctl.enableDamping=true; ctl.dampingFactor=.08; ctl.minDistance=101.5; ctl.maxDistance=700; ctl.zoomSpeed=1.3;
setTimeout(()=>{if(!sel)ctl.autoRotate=true},5200);
ctl.addEventListener('start',()=>{follow=false;ctl.autoRotate=false;btn()});

/* ---------- Plane meshes ---------- */
const cv=document.createElement('canvas'); cv.width=cv.height=64;
(c=>{c.beginPath();[[32,2],[36,22],[60,38],[60,43],[36,35],[35,52],[44,58],[44,62],[32,59],[20,62],[20,58],[29,52],[28,35],[4,43],[4,38],[28,22]].forEach((p,i)=>i?c.lineTo(...p):c.moveTo(...p));c.closePath();c.lineWidth=5;c.strokeStyle='rgba(0,0,0,.7)';c.stroke();c.fillStyle='#fff';c.fill()})(cv.getContext('2d'));
const tex=new THREE.CanvasTexture(cv), geo=new THREE.PlaneGeometry(1,1);
const mat=c=>new THREE.MeshBasicMaterial({map:tex,color:c,transparent:true,side:THREE.DoubleSide,depthWrite:false});
const M={n:mat(0xffc233),mil:mat(0xff5a4f),heli:mat(0x4fd1c5),uav:mat(0xb79cff),sel:mat(0xffffff),em:mat(0xff9500)};
function cls(a){return a.em?'em':a.mil?'mil':a.cat==='A7'?'heli':(a.cat==='B6'||a.cat==='B7')?'uav':'n'}
const V=[new THREE.Vector3(),new THREE.Vector3(),new THREE.Vector3(),new THREE.Vector3(),new THREE.Vector3()],MX=new THREE.Matrix4();

/* ---------- Data ---------- */
async function getJSON(path){
  for(const h of HOSTS){
    const name=h.replace(/^https?:\/\/(api\.|opendata\.)?/,'').split('/')[0];
    let u=h+path;
    if(h.includes('adsb.fi')) u=h+path.replace(/\/point\/([^/]+)\/([^/]+)\/(\d+)/,'/lat/$1/lon/$2/dist/$3');
    try{
      const r=await fetch(u);
      if(r.ok){const j=await r.json();DBG[name]='OK';showDbg();return j}
      DBG[name]='HTTP '+r.status;
    }catch(e){DBG[name]=(e&&e.message)||'error'}
  }
  showDbg();return null;
}
function showDbg(){$('#dbg').textContent=Object.entries(DBG).map(([k,v])=>k+': '+v).join(' | ')}
function ingest(list){
  const now=Date.now(); let added=false;
  for(const x of list||[]){
    if(x.lat==null||x.lon==null||!x.hex) continue;
    let a=A.get(x.hex);
    if(!a){a={hex:x.hex,mesh:new THREE.Mesh(geo,M.n),dlat:x.lat,dlng:x.lon};A.set(x.hex,a);added=true}
    a.lat=x.lat;a.lon=x.lon;a.ts=now-(x.seen_pos||0)*1000;a.seen=now;
    a.gs=x.gs||0;a.trk=x.track??x.true_heading??a.trk??0;a.alt=x.alt_baro;a.gnd=x.alt_baro==='ground';
    a.cs=(x.flight||'').trim();a.reg=x.r;a.type=x.t;a.desc=x.desc;a.sq=x.squawk;
    a.vr=x.baro_rate??x.geom_rate;a.mil=((x.dbFlags||0)&1)===1;a.cat=x.category;
    a.em=(x.emergency&&x.emergency!=='none')||['7500','7600','7700'].includes(x.squawk);
  }
  if(added) G.customLayerData([...A.values()]);
}
async function poll(){
  tick++;const p=G.pointOfView();let path;
  if(sel&&tick%3===1) path='/hex/'+sel;
  else if(tick%9===0) path='/mil';
  else if(p.altitude<1.4&&tick%2===0) path=`/point/${p.lat.toFixed(2)}/${p.lng.toFixed(2)}/250`;
  else{const h=HUBS[hi++%HUBS.length];path=`/point/${h[0]}/${h[1]}/250`}
  const j=await getJSON(path);
  $('#dot').className=j?'ok':'err';
  if(j) ingest(j.ac);
}
setInterval(poll,1200);poll();
setInterval(()=>{
  const now=Date.now();let ch=false;
  for(const [k,a] of A) if(now-a.seen>150000&&k!==sel){A.delete(k);ch=true}
  if(ch) G.customLayerData([...A.values()]);
},10000);

/* ---------- Math ---------- */
function hav(a,b,c,d){const x=Math.sin((c-a)*R/2)**2+Math.cos(a*R)*Math.cos(c*R)*Math.sin((d-b)*R/2)**2;return 12742*Math.asin(Math.sqrt(x))}
function gc(a,b,c,d,n=48){
  const f=(la,lo)=>[Math.cos(la*R)*Math.cos(lo*R),Math.cos(la*R)*Math.sin(lo*R),Math.sin(la*R)];
  const p=f(a,b),q=f(c,d),w=Math.acos(Math.min(1,Math.max(-1,p[0]*q[0]+p[1]*q[1]+p[2]*q[2])));
  if(w<1e-6) return [[a,b],[c,d]];
  const o=[];for(let i=0;i<=n;i++){const t=i/n,s1=Math.sin((1-t)*w)/Math.sin(w),s2=Math.sin(t*w)/Math.sin(w);
    const v=[0,1,2].map(k=>s1*p[k]+s2*q[k]);o.push([Math.atan2(v[2],Math.hypot(v[0],v[1]))/R,Math.atan2(v[1],v[0])/R])}
  return o;
}
function predict(a,now){
  const dt=Math.min(70,(now-a.ts)/1000),d=a.gs*.514444*dt,h=(a.trk||0)*R;
  return[a.lat+d*Math.cos(h)/6371000/R,a.lon+d*Math.sin(h)/(6371000*Math.cos(a.lat*R))/R];
}
const ok=a=>!a.gnd&&(filter==='all'||(filter==='mil'&&a.mil)||(filter==='heli'&&a.cat==='A7')||(filter==='uav'&&(a.cat==='B6'||a.cat==='B7'))||(filter==='em'&&a.em));

/* ---------- Render loop ---------- */
function frame(){
  const now=Date.now(),alt=G.pointOfView().altitude,sz=.25+alt*.6;
  for(const a of A.values()){
    const m=a.mesh,v=ok(a)||a.hex===sel;m.visible=v;if(!v) continue;
    const t=predict(a,now);a.dlat+=(t[0]-a.dlat)*.15;a.dlng+=(t[1]-a.dlng)*.15;
    const al=.004+Math.min(Math.max(a.alt||0,0)/40000,1)*.02,c=G.getCoords(a.dlat,a.dlng,al);
    const [p,n,no,e,f]=V;p.set(c.x,c.y,c.z);n.copy(p).normalize();
    no.set(0,1,0).addScaledVector(n,-n.y).normalize();e.crossVectors(no,n);
    const h=(a.trk||0)*R;f.copy(no).multiplyScalar(Math.cos(h)).addScaledVector(e,Math.sin(h));
    e.crossVectors(f,n);MX.makeBasis(e,f,n);m.quaternion.setFromRotationMatrix(MX);m.position.copy(p);
    const s=a.hex===sel?sz*1.7:sz;m.scale.set(s,s,s);
    const mt=a.hex===sel?M.sel:M[cls(a)];if(m.material!==mt)m.material=mt;
  }
  if(follow&&sel){const a=A.get(sel);if(a)G.pointOfView({lat:a.dlat,lng:a.dlng},0)}
  requestAnimationFrame(frame);
}
frame();

/* ---------- UI ---------- */
document.querySelectorAll('.chip[data-f]').forEach(b=>b.onclick=()=>{
  filter=b.dataset.f;document.querySelectorAll('.chip[data-f]').forEach(x=>x.classList.toggle('on',x===b));count();
});
function count(){let v=0,m=0;for(const a of A.values()){if(a.gnd)continue;v++;if(a.mil)m++}
  $('#n').textContent=v.toLocaleString()+(m?` · ${m} loltuu`:'')}
setInterval(count,1500);
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),2600)}
function btn(){const b=$('#fb');if(b)b.classList.toggle('on',follow)}

async function select(hex){
  sel=hex;follow=true;ctl.autoRotate=false;const a=A.get(hex);if(!a) return;
  $('#panel').classList.add('open');
  G.pointOfView({lat:a.dlat,lng:a.dlng,altitude:.55},1400);
  loadExtra(a);render();
}
async function loadExtra(a){
  if(a.cs&&!cache['c'+a.cs]){
    cache['c'+a.cs]=1;
    try{const r=await(await fetch('https://api.adsbdb.com/v0/callsign/'+a.cs)).json();
      cache['c'+a.cs]=r.response&&r.response.flightroute||0}catch(e){cache['c'+a.cs]=0}
  }
  if(!cache['h'+a.hex]){
    cache['h'+a.hex]=1;
    try{const r=await(await fetch('https://api.adsbdb.com/v0/aircraft/'+a.hex)).json();
      cache['h'+a.hex]=r.response&&r.response.aircraft||0}catch(e){cache['h'+a.hex]=0}
  }
}
const fmtT=h=>{if(!isFinite(h)||h<0)return'—';const m=Math.round(h*60);return`${Math.floor(m/60)} sa'aa ${m%60} daq`};
const nf=x=>Math.round(x).toLocaleString();
const dirs=['N','NE','E','SE','S','SW','W','NW'];

function render(){
  const a=A.get(sel),P=$('#panel');if(!a) return;
  const fr=cache['c'+a.cs],ac=cache['h'+a.hex];
  const o=fr&&fr.origin,d=fr&&fr.destination;
  let rt='',bar='',kmF='—',kmR='—',el='—',eta='—',pct=0;
  if(o&&d){
    const f=hav(o.latitude,o.longitude,a.dlat,a.dlng),r=hav(a.dlat,a.dlng,d.latitude,d.longitude),v=a.gs*1.852;
    pct=Math.min(100,Math.max(0,f/(f+r)*100));kmF=nf(f)+' km';kmR=nf(r)+' km';
    if(v>50){el=fmtT(f/v);eta=fmtT(r/v)}
    rt=`<div class="route"><div class="ap"><b>${o.iata_code||o.icao_code}</b><span>${o.municipality||o.name}</span></div>
      <div class="mid">✈</div><div class="ap"><b>${d.iata_code||d.icao_code}</b><span>${d.municipality||d.name}</span></div></div>
      <div class="bar"><i style="width:${pct}%"></i></div>`;
  }
  const alt=typeof a.alt==='number'?a.alt:0,vr=a.vr||0;
  const tags=(a.mil?'<span class="tag m">LOLTUU</span>':'')+(a.em?`<span class="tag e">BALAA ${a.sq||''}</span>`:'');
  const name=(fr&&fr.airline&&fr.airline.name)||(ac&&ac.registered_owner)||'';
  const model=a.desc||(ac&&(ac.manufacturer+' '+ac.type))||a.type||'—';
  P.innerHTML=`<div class="h"><div><div class="cs">${a.cs||a.reg||a.hex.toUpperCase()}</div>
    <div class="sub">${tags}${name}</div><div class="sub">${model}</div></div>
    <div style="display:flex;gap:6px"><button class="btn ${follow?'on':''}" id="fb">Hordofi</button><button class="btn" id="xb">✕</button></div></div>
    ${rt}
    <div class="grid">
    <div class="s"><small>Ol-ka'iinsa</small><b>${nf(alt)} ft</b> <em>${nf(alt*.3048)} m</em></div>
    <div class="s"><small>Saffisa</small><b>${nf(a.gs)} kt</b> <em>${nf(a.gs*1.852)} km/s</em></div>
    <div class="s"><small>Qajeelfama</small><b>${nf(a.trk||0)}° ${dirs[Math.round((a.trk||0)/45)%8]}</b></div>
    <div class="s"><small>${vr<-100?'Gadi bu\'aa':vr>100?'Ol ba\'aa':'Sadarkaa'}</small><b>${nf(Math.abs(vr))} ft/min</b></div>
    <div class="s"><small>Yeroo balaleen (tilmaama)</small><b>${el}</b></div>
    <div class="s"><small>Yeroo hafe (ETA)</small><b>${eta}</b></div>
    <div class="s"><small>Fageenya deemte</small><b>${kmF}</b></div>
    <div class="s"><small>Fageenya hafe</small><b>${kmR}</b></div>
    <div class="s"><small>Registration</small><b>${a.reg||'—'}</b></div>
    <div class="s"><small>Type · Hex</small><b>${a.type||'—'} · ${a.hex.toUpperCase()}</b></div>
    <div class="s"><small>Squawk</small><b>${a.sq||'—'}</b></div>
    <div class="s"><small>Bakka amma</small><b>${a.dlat.toFixed(2)}, ${a.dlng.toFixed(2)}</b></div></div>
    ${!fr&&cache['c'+a.cs]===0?'<div class="sub" style="margin-top:10px">Odeeffannoon karaa (ka\'e/deemu) hin argamne.</div>':''}
    <img id="photo" ${ac&&ac.url_photo_thumbnail?`src="${ac.url_photo_thumbnail}" style="display:block"`:''} alt="">`;
  $('#xb').onclick=close;$('#fb').onclick=()=>{follow=!follow;btn()};
  /* sararoota karaa */
  if(o&&d){
    G.pathsData([
      {pts:gc(o.latitude,o.longitude,a.dlat,a.dlng,40),color:'#ffc233',dash:false},
      {pts:gc(a.dlat,a.dlng,d.latitude,d.longitude,40),color:'#4fd1c5',dash:true}]);
  }else G.pathsData([]);
  G.ringsData([{lat:a.dlat,lng:a.dlng}]);
}
function close(){sel=null;follow=false;$('#panel').classList.remove('open');G.pathsData([]);G.ringsData([])}
setInterval(()=>{if(sel)render()},1000);

/* ---------- Biyyoota, dhaabbata xiyyaaraa 🛑, meesha waraanaa 🚀 ---------- */

const L={ap:true,wp:true};let CT=[],lastN=-1,pend=0;
G.htmlElementsData(SITES).htmlLat('lat').htmlLng('lng').htmlAltitude(.003).htmlTransitionDuration(0).htmlElement(d=>{
  const e=document.createElement('div');e.textContent=d.k==='ap'?'🛑':'🚀';
  e.style.cssText='font-size:15px;cursor:pointer;pointer-events:auto;transform:translate(-50%,-50%);filter:drop-shadow(0 0 4px #000);display:none';
  const t=(d.k==='ap'?'🛑 '+d.code+' · ':'🚀 ')+d.name;e.title=t;e.onclick=()=>toast(t);d.el=e;return e});
function updLayers(){
  pend=0;const alt=G.pointOfView().altitude;
  const n=alt>2.2?30:alt>1.3?70:alt>.7?130:400;
  if(n!==lastN&&CT.length){lastN=n;G.labelsData(CT.slice(0,n)).labelSize(alt>1.3?.55:.35)}
  const c=G.camera().position,cl=Math.hypot(c.x,c.y,c.z),lim=1/(1+alt)+.03;
  for(const s of SITES){if(!s.el)continue;const d=(s.n[0]*c.x+s.n[1]*c.y+s.n[2]*c.z)/cl;
    s.el.style.display=(L[s.k]&&d>lim&&(s.k==='wp'||alt<2.8))?'block':'none'}
}

  CT=f.map(x=>{const g=x.geometry,P=g.type==='Polygon'?[g.coordinates]:g.coordinates;let best={lat:0,lng:0},ba=-1;
    P.forEach(pl=>{let a0=1e9,b0=1e9,a1=-1e9,b1=-1e9;pl[0].forEach(([lo,la])=>{a0=Math.min(a0,lo);a1=Math.max(a1,lo);b0=Math.min(b0,la);b1=Math.max(b1,la)});
      const ar=(a1-a0)*(b1-b0);if(ar>ba){ba=ar;best={lat:(b0+b1)/2,lng:(a0+a1)/2}}});
    return{name:x.properties.NAME||x.properties.ADMIN,area:ba,...best}}).sort((a,b)=>b.area-a.area);
  updLayers();
}).catch(()=>{});

    const j=await getJSON(p+t);
    if(j&&j.ac&&j.ac.length){ingest(j.ac);return select(j.ac[0].hex)}
  }
  toast('Xiyyaaraan kun amma hin mul\'anne.');
});
